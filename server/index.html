<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金庸群俠傳</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b0d; color: #e8e8ea;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh; padding: 18px 12px 28px;
  }
  #app {
    display: flex; gap: 18px; align-items: flex-start; justify-content: center;
  }
  #main {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; min-width: 0;
  }
  #side {
    width: 316px; flex: none; align-self: stretch;
    display: flex; flex-direction: column;
    border: 1px solid #26262c; border-radius: 5px; background: #101014;
    max-height: calc(100vh - 46px);
  }
  #side h2 {
    margin: 0; padding: 10px 12px 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .12em; color: #c9c9cf; border-bottom: 1px solid #1e1e24;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #side h2 em { font-style: normal; color: #5b5b66; font-size: 10px; letter-spacing: 0; }
  #side h2 .right { display: flex; align-items: center; gap: 8px; }
  #play, #save {
    padding: 3px 9px; font-size: 10.5px; letter-spacing: .04em;
    background: #17171b; border: 1px solid #2e2e36; border-radius: 4px;
    color: #cdcdd6; cursor: pointer;
  }
  #play:hover, #save:hover { border-color: #4a4a58; color: #fff; }
  #play[disabled], #save[disabled] { opacity: .45; cursor: default; }
  #vcr {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: #000d; backdrop-filter: blur(2px);
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #vcr.on { display: flex; }
  #vcr canvas {
    image-rendering: pixelated; border: 1px solid #2e2e36; border-radius: 3px;
    background: #000; width: min(88vw, 960px); height: auto;
  }
  #vcrkeys .k { font-size: 13px; min-width: 20px; padding: 2px 6px; }
  #vcrbar { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #9a9aa6; }
  #vcrkeys { display: flex; gap: 4px; min-height: 20px; align-items: center; }
  #vcrtrack { width: 260px; height: 4px; background: #26262c; border-radius: 2px; overflow: hidden; }
  #vcrfill { display: block; height: 4px; width: 0; background: #6cb6ff; }
  #logrows { overflow-y: auto; padding: 6px 0 10px; flex: 1; }
  .r { display: flex; gap: 7px; padding: 2px 12px; font-size: 11px; line-height: 1.5; white-space: nowrap; }
  .r:hover { background: #17171c; }
  .shot { padding: 3px 12px 7px 46px; }
  .shot img {
    width: 150px; display: block; image-rendering: pixelated;
    border: 1px solid #2a2a32; border-radius: 3px; cursor: zoom-in;
  }
  .shot img:hover { border-color: #4a4a58; }
  .k {
    display: inline-block; min-width: 15px; text-align: center;
    background: #1c1c22; border: 1px solid #33333d; border-radius: 3px;
    color: #cdcdd6; padding: 0 3px; margin-right: 3px; font-size: 11px;
  }
  .k.arrow { color: #8ecdf7; border-color: #2f4658; }
  .r .ts { color: #4a4a55; }
  .r .src {
    flex: none; max-width: 72px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .r .vbwrap { flex: none; width: 38px; }
  .r .vb { font-weight: 700; }
  .r .held { color: #8a8a96; margin-left: 2px; }
  #meter {
    display: flex; gap: 10px; padding: 6px 12px 6px; font-size: 10.5px;
    color: #6c6c78; letter-spacing: .03em;
  }
  #meter b { color: #b9b9c2; font-weight: 600; }
  #bars { padding: 0 12px 9px; border-bottom: 1px solid #1e1e24; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 10.5px; padding: 1px 0; }
  .bar .who {
    width: 96px; flex: none; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar .track {
    flex: 1; height: 9px; background: #17171c; border-radius: 2px;
    overflow: hidden;
  }
  /* display:block matters: width and height do not apply to an inline span,
     so the fill rendered as a zero-size box inside a visible track. */
  .bar .fill { display: block; height: 9px; border-radius: 2px; min-width: 2px; }
  .bar .num { width: 26px; flex: none; text-align: right; color: #8a8a96; }
  .r .tg { color: #d8d8de; overflow: hidden; text-overflow: ellipsis; }
  .v-KEY, .v-KEYS, .v-TEXT { color: #6cb6ff; }
  .v-WAIT { color: #8a8a96; }
  .v-GET  { color: #7ec699; }
  #empty { color: #55555f; font-size: 11px; padding: 10px 12px; }
  @media (max-width: 900px) {
    #app { flex-direction: column; align-items: center; }
    #side { width: min(100%, 620px); max-height: 300px; }
  }
  #wrap { position: relative; line-height: 0; }
  canvas {
    image-rendering: pixelated;
    background: #000;
    border: 1px solid #26262c;
    border-radius: 3px;
    max-width: 100%;
    height: auto;
    display: block;
  }
  #veil {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: #000c; font-size: 12px; letter-spacing: .1em; border-radius: 3px;
  }
  #veil.gone { display: none; }
  #pad { display: grid; grid-template-columns: repeat(3, 46px); gap: 6px; }
  #pad { grid-template-columns: repeat(2, 52px); }
  #pad [data-k=left]  { grid-area: 1 / 1; }
  #pad [data-k=up]    { grid-area: 1 / 2; }
  #pad [data-k=down]  { grid-area: 2 / 1; }
  #pad [data-k=right] { grid-area: 2 / 2; }
  button {
    background: #17171b; color: #d8d8dd; border: 1px solid #2e2e36;
    border-radius: 5px; padding: 9px 0; font: inherit; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button:active { background: #2a2a33; border-color: #4a4a58; }
  button.hit {
    background: #2c4a63; border-color: #6fa8d6; color: #fff;
    transition: none;
  }
  button { transition: background .25s ease, border-color .25s ease, color .25s ease; }
  #pad button { font-size: 15px; line-height: 1.1; }
  #pad button small { display: block; font-size: 9px; color: #6c6c78; }
  #keys { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 380px; }
  #keys button { padding: 9px 13px; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  #hud { color: #6c6c78; font-size: 11px; letter-spacing: .04em; text-align: center; }
  details {
    width: min(100%, 900px); border: 1px solid #26262c; border-radius: 5px;
    background: #101014;
  }
  summary {
    cursor: pointer; padding: 11px 14px; color: #c9c9cf; font-size: 12px;
    letter-spacing: .05em; list-style: none; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary span.hint { color: #6c6c78; font-size: 11px; letter-spacing: 0; }
  #promptbox { padding: 0 14px 14px; }
  #prompt {
    width: 100%; height: 260px; resize: vertical;
    background: #08080a; color: #b6b6bf; border: 1px solid #26262c;
    border-radius: 4px; padding: 10px; font: 11px/1.55 ui-monospace, Menlo, monospace;
    white-space: pre; overflow: auto;
  }
  #promptbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .lang { display: flex; gap: 0; margin-left: auto; }
  .lang button {
    border-radius: 0; border-left-width: 0; padding: 5px 11px; font-size: 11px;
  }
  .lang button:first-child { border-radius: 4px 0 0 4px; border-left-width: 1px; }
  .lang button:last-child { border-radius: 0 4px 4px 0; }
  .lang button[aria-pressed=true] { background: #2a2a33; color: #fff; border-color: #4a4a58; }
  #copied { color: #64b47a; font-size: 11px; opacity: 0; transition: opacity .2s; }
  #copied.on { opacity: 1; }
</style>

<div id="app">
<div id="main">
<div id="wrap">
  <canvas id="screen" width="320" height="200"></canvas>
  <div id="veil">connecting…</div>
</div>

<div class="row">
  <div id="pad">
    <button data-k="up" title="up / kp9 — moves up-right on screen">↗<small>up</small></button>
    <button data-k="left" title="left / kp7 — moves up-left on screen">↖<small>left</small></button>
    <button data-k="down" title="down / kp1 — moves down-left on screen">↙<small>down</small></button>
    <button data-k="right" title="right / kp3 — moves down-right on screen">↘<small>right</small></button>
  </div>
  <div id="keys">
    <button data-k="enter">Enter 確定</button>
    <button data-k="space">Space</button>
    <button data-k="esc">Esc 選單</button>
    <button data-k="y">Y</button>
    <button data-k="n">N</button>
  </div>
</div>

<details>
  <summary>
    <b>Let your own LLM play this</b>
    <span class="hint">paste into your model's system prompt, no harness needed</span>
  </summary>
  <div id="promptbox">
    <textarea id="prompt" readonly spellcheck="false">loading…</textarea>
    <div id="promptbar">
      <button id="copy">Copy skill</button>
      <button id="open">Open as text</button>
      <span id="copied">copied</span>
      <span class="lang">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
      </span>
    </div>
  </div>
</details>

<div id="hud"><span id="stat"></span></div>

<div id="vcr">
  <canvas id="vcv" width="320" height="200"></canvas>
  <div id="vcrkeys"></div>
  <div id="vcrbar">
    <span id="vcrtime">0:00</span>
    <span id="vcrtrack"><span id="vcrfill"></span></span>
    <button id="vcrclose">close</button>
  </div>
</div>
</div>

<aside id="side">
  <h2>ACTIVITY
    <span class="right"><em id="logcount"></em>
      <button id="play">▶ 4×</button><button id="save">⤓ mp4</button></span>
  </h2>
  <div id="meter">
    <span>played <b id="m-time">0:00</b></span>
    <span>actions <b id="m-acts">0</b></span>
    <span>agent <b id="m-api">0</b></span>
    <span>web <b id="m-web">0</b></span>
  </div>
  <div id="bars"></div>
  <div id="logrows"><div id="empty">nothing yet. keys you press here, and calls
    to /api/*, both show up.</div></div>
</aside>
</div>

<script>
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d", { alpha: false });
const veil = document.getElementById("veil");
const stat = document.getElementById("stat");
let sock, tileImg = null, got = 0, bytes = 0;

function fit() {
  // integer-scale the 320x200 picture to whatever the viewport allows
  const k = Math.max(1, Math.min(Math.floor((window.innerWidth - 40) / cv.width),
                                 Math.floor((window.innerHeight - 260) / cv.height)));
  cv.style.width = cv.width * k + "px";
}
addEventListener("resize", fit);

async function inflate(buf) {
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

// Paints one tile delta onto any canvas. Shared by the live stream and playback.
function paintDelta(d, canvas, c2d, cache) {
  const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const w = dv.getUint16(1, true), h = dv.getUint16(3, true);
  const tw = d[5], th = d[6];
  const cols = dv.getUint16(7, true);
  const count = dv.getUint16(11, true);
  let resized = false;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h; resized = true;
    c2d.fillStyle = "#000"; c2d.fillRect(0, 0, w, h);
    cache.img = null;
  }
  if (!cache.img || cache.img.width !== tw || cache.img.height !== th) {
    cache.img = c2d.createImageData(tw, th);
  }
  const idxOff = 13, dataOff = idxOff + count * 2, tileLen = tw * th * 3;
  const px = cache.img.data;
  for (let i = 0; i < count; i++) {
    const t = dv.getUint16(idxOff + i * 2, true);
    let s = dataOff + i * tileLen;
    for (let p = 0; p < tw * th; p++) {
      px[p * 4] = d[s++]; px[p * 4 + 1] = d[s++]; px[p * 4 + 2] = d[s++]; px[p * 4 + 3] = 255;
    }
    c2d.putImageData(cache.img, (t % cols) * tw, Math.floor(t / cols) * th);
  }
  return { w, h, count, resized };
}

const liveCache = {};
async function onFrame(raw) {
  const d = await inflate(raw);
  const { w, h, count, resized } = paintDelta(d, cv, ctx, liveCache);
  if (resized) fit();
  got++; bytes += raw.byteLength;
  stat.textContent = ` · ${w}×${h} · ${count} tiles, ${(raw.byteLength / 1024).toFixed(1)} KB`
                   + ` · ${(bytes / 1024).toFixed(0)} KB total`;
  veil.classList.add("gone");
}

// ---- playback -------------------------------------------------------------
const vcr = document.getElementById("vcr");
const vcv = document.getElementById("vcv");
const vctx = vcv.getContext("2d", { alpha: false });
const vcrKeys = document.getElementById("vcrkeys");
const playBtn = document.getElementById("play");
let vcrStop = null;

const b64bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

function vcrClose() {
  if (vcrStop) { vcrStop(); vcrStop = null; }
  vcr.classList.remove("on");
  playBtn.disabled = false;
  playBtn.textContent = "▶ 4×";
}
document.getElementById("vcrclose").onclick = vcrClose;
vcr.onclick = e => { if (e.target === vcr) vcrClose(); };
addEventListener("keydown", e => { if (e.key === "Escape" && vcr.classList.contains("on")) vcrClose(); });

// ---- export the recording as a video ---------------------------------------
const saveBtn = document.getElementById("save");

function pickMime() {
  for (const t of ["video/mp4;codecs=avc1.42E01E", "video/mp4",
                   "video/webm;codecs=vp9", "video/webm"]) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return "";
}

saveBtn.onclick = async () => {
  if (!window.MediaRecorder) return;
  const mime = pickMime();
  if (!mime) { saveBtn.textContent = "unsupported"; return; }

  saveBtn.disabled = true;
  playBtn.disabled = true;
  saveBtn.title = "encodes in real time at 4x, so about a quarter of the session length";
  saveBtn.textContent = "loading";
  let events;
  // MediaRecorder samples in real time, so the export takes the recording
  // length divided by the playback speed. Say so rather than appear stuck.
  try {
    events = (await (await fetch("/api/recording")).json()).events || [];
  } catch { saveBtn.disabled = playBtn.disabled = false; saveBtn.textContent = "⤓ mp4"; return; }
  if (!events.length) { saveBtn.disabled = playBtn.disabled = false; saveBtn.textContent = "⤓ mp4"; return; }

  // 640x400 keeps both game modes at a whole multiple, plus a strip for keys.
  const W = 640, H = 400, BAR = 56;
  const out = document.createElement("canvas");
  out.width = W; out.height = H + BAR;
  const octx = out.getContext("2d", { alpha: false });
  octx.imageSmoothingEnabled = false;
  const work = document.createElement("canvas");
  const wctx = work.getContext("2d", { alpha: false });
  const cache = {};
  const down = new Set();
  let clock = 0, actor = "";

  const chip = (label, x, y, arrow) => {
    const w = octx.measureText(label).width + 20;
    octx.fillStyle = "#1c1c22";
    octx.strokeStyle = arrow ? "#3f6076" : "#33333d";
    octx.beginPath();
    octx.roundRect(x, y, w, 32, 5);
    octx.fill(); octx.stroke();
    octx.fillStyle = arrow ? "#8ecdf7" : "#cdcdd6";
    octx.fillText(label, x + 10, y + 16);
    return w;
  };

  const compose = () => {
    octx.fillStyle = "#0b0b0d";
    octx.fillRect(0, 0, W, H + BAR);
    if (work.width) {
      const sc = Math.min(W / work.width, H / work.height);
      const dw = work.width * sc, dh = work.height * sc;
      octx.drawImage(work, (W - dw) / 2, (H - dh) / 2, dw, dh);
    }
    octx.fillStyle = "#101014";
    octx.fillRect(0, H, W, BAR);
    octx.textBaseline = "middle";
    let x = 14;
    if (actor) {
      octx.font = "17px ui-monospace, Menlo, monospace";
      octx.fillStyle = colorOf(actor);
      octx.fillText(actor, x, H + 28);
      x += octx.measureText(actor).width + 16;
    }
    octx.font = "20px ui-monospace, Menlo, monospace";
    for (const k of down) x += chip(GLYPH[k] ?? k, x, H + 12, ARROW.has(k)) + 8;
    octx.fillStyle = "#6c6c78";
    octx.font = "16px ui-monospace, Menlo, monospace";
    octx.textAlign = "right";
    octx.fillText(fmt(clock) + "  4x", W - 14, H + 28);
    octx.textAlign = "left";
  };

  compose();
  const stream = out.captureStream(30);
  const mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
  const chunks = [];
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  const finished = new Promise(r => (mr.onstop = r));
  mr.start();

  const SPEED = 4;
  const total = events[events.length - 1].t || 1;
  const t0 = performance.now();
  let i = 0;
  let raf = requestAnimationFrame(function loop() { compose(); raf = requestAnimationFrame(loop); });

  while (i < events.length) {
    const ev = events[i];
    const wait = t0 + (ev.t * 1000) / SPEED - performance.now();
    if (wait > 2) { await new Promise(r => setTimeout(r, wait)); continue; }
    i++;
    clock = ev.t;
    if (ev.d) {
      paintDelta(await inflate(b64bytes(ev.d)), work, wctx, cache);
    } else if (ev.key) {
      if (ev.who) actor = ev.who;
      ev.down ? down.add(ev.key) : down.delete(ev.key);
    }
    const left = Math.max(0, (total - ev.t) / SPEED);
    saveBtn.textContent = Math.round((ev.t / total) * 100) + "% " + fmt(left);
  }

  await new Promise(r => setTimeout(r, 300));   // let the tail frames be sampled
  cancelAnimationFrame(raf);
  mr.stop();
  await finished;

  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
  const blob = new Blob(chunks, { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `jy-crpg-bench-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);

  saveBtn.textContent = "⤓ " + ext;
  saveBtn.disabled = playBtn.disabled = false;
};

playBtn.onclick = async () => {
  playBtn.disabled = true;
  playBtn.textContent = "loading";
  let recording;
  try {
    recording = await (await fetch("/api/recording")).json();
  } catch { playBtn.disabled = false; playBtn.textContent = "▶ 4×"; return; }
  const events = recording.events || [];
  if (!events.length) { playBtn.disabled = false; playBtn.textContent = "▶ 4×"; return; }

  playBtn.textContent = "playing";
  vcr.classList.add("on");
  vctx.fillStyle = "#000";
  vctx.fillRect(0, 0, vcv.width, vcv.height);
  vcrKeys.textContent = "";

  const SPEED = 4;
  const total = events[events.length - 1].t;
  const cache = {};
  const down = new Set();
  let cancelled = false, i = 0;
  vcrStop = () => { cancelled = true; };

  const t0 = performance.now();
  const step = async () => {
    while (i < events.length && !cancelled) {
      const ev = events[i];
      const due = t0 + (ev.t * 1000) / SPEED;
      const wait = due - performance.now();
      if (wait > 4) { setTimeout(step, wait); return; }
      i++;
      if (ev.d) {
        paintDelta(await inflate(b64bytes(ev.d)), vcv, vctx, cache);
      } else if (ev.key) {
        ev.down ? down.add(ev.key) : down.delete(ev.key);
        vcrKeys.textContent = "";
        if (ev.who) {
          const who = document.createElement("span");
          who.textContent = ev.who;
          who.style.color = colorOf(ev.who);
          who.style.marginRight = "6px";
          vcrKeys.appendChild(who);
        }
        for (const k of down) {
          const chip = document.createElement("span");
          chip.className = "k" + (ARROW.has(k) ? " arrow" : "");
          chip.textContent = GLYPH[k] ?? k;
          vcrKeys.appendChild(chip);
        }
      }
      document.getElementById("vcrfill").style.width = (ev.t / total) * 100 + "%";
      document.getElementById("vcrtime").textContent = fmt(ev.t);
    }
    if (!cancelled) { playBtn.textContent = "▶ 4×"; }
  };
  step();
};

function connect() {
  sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  sock.binaryType = "arraybuffer";
  sock.onmessage = e => {
    if (typeof e.data === "string") {
      const m = JSON.parse(e.data);
      if (m.t === "log") {
        // A process restart resets history ids and session counters. A page
        // that reconnects without reloading still has the old lastId, so it
        // would reject every new entry as a duplicate until ids catch up.
        // Distinguish a restarted session from an ordinary socket reconnect
        // by identity. Counts and projected uptime are a compatibility
        // fallback for a page reconnecting to an older server.
        if (m.s && meter) {
          const oldUptime = meter.uptime_s + (Date.now() - meterAt) / 1000;
          const restarted = m.s.started_at !== undefined && meter.started_at !== undefined
            ? m.s.started_at !== meter.started_at
            : m.s.actions < meter.actions || m.s.uptime_s + 3 < oldUptime;
          if (restarted) clearLog();
        }
        m.e.forEach(addLog);
        if (m.s) setMeter(m.s);
      }
      else if (m.t === "key") { holdKey(m.k, m.down); noteKeyTiming(m.k, m.down); }
      else if (m.t === "clear") clearLog();
    } else {
      onFrame(e.data);
    }
  };
  sock.onopen = () => veil.textContent = "waiting for the first frame…";
  sock.onclose = () => {
    veil.textContent = "disconnected, retrying…";
    veil.classList.remove("gone");
    setTimeout(connect, 1500);
  };
}

const rows = document.getElementById("logrows");
const empty = document.getElementById("empty");
const logcount = document.getElementById("logcount");
let logged = 0, lastId = 0;

const GLYPH = { up: "↗", down: "↙", left: "↖", right: "↘", enter: "⏎",
                space: "␣", esc: "esc", backspace: "⌫", tab: "⇥",
                kp9: "↗", kp1: "↙", kp7: "↖", kp3: "↘" };
const ARROW = new Set(["up", "down", "left", "right", "kp9", "kp1", "kp7", "kp3",
                       "upright", "downleft", "upleft", "downright"]);
// every spelling of a movement key lights the same button
const SAMEKEY = { kp9: "up", ne: "up", upright: "up", kp1: "down", sw: "down",
                  downleft: "down", kp7: "left", nw: "left", upleft: "left",
                  kp3: "right", se: "right", downright: "right",
                  return: "enter", ok: "enter", escape: "esc", cancel: "esc" };

// down=true lights the button and leaves it lit; down=false clears it. The
// safety timer only exists so a lost keyup cannot strand a button lit forever.
function holdKey(name, down) {
  const b = document.querySelector(`button[data-k="${SAMEKEY[name] || name}"]`);
  if (!b) return;
  clearTimeout(b._t);
  if (down) {
    b.classList.add("hit");
    b._t = setTimeout(() => b.classList.remove("hit"), 12000);
  } else {
    b.classList.remove("hit");
  }
}

// The log line says which key, never for how long, so a press held for over a
// second reads the same as a tap. The key events carry real timing, so measure
// it here and write it onto the row that caused it.
const HELD_MIN_MS = 250;
const downAt = new Map();
let awaitingHold = [];

function noteKeyTiming(name, down) {
  const now = performance.now();
  if (down) { downAt.set(name, now); return; }
  const t0 = downAt.get(name);
  downAt.delete(name);
  if (t0 === undefined) return;
  const ms = now - t0;
  if (ms < HELD_MIN_MS) return;
  for (let i = awaitingHold.length - 1; i >= 0; i--) {
    const slot = awaitingHold[i];
    if (!slot.keys.has(name) || !slot.el.isConnected) continue;
    if (ms <= slot.ms) return;
    slot.ms = ms;
    let chip = slot.el.querySelector(".held");
    if (!chip) {
      chip = document.createElement("span");
      chip.className = "held";
      slot.el.querySelector(".tg").appendChild(chip);
    }
    chip.textContent = " " + (ms / 1000).toFixed(1) + "s";
    return;
  }
}

// A brief blink, for events we only learn about after the fact.
function flashKey(name) {
  const b = document.querySelector(`button[data-k="${SAMEKEY[name] || name}"]`);
  if (!b) return;
  clearTimeout(b._t);
  b.classList.add("hit");
  b._t = setTimeout(() => b.classList.remove("hit"), 180);
}

function keySpans(text) {
  const out = document.createDocumentFragment();
  for (const tok of text.split(" ")) {
    if (!tok) continue;
    if (/^x\d+$/.test(tok)) {                 // repeat marker, not a key
      const s = document.createElement("span");
      s.textContent = " " + tok;
      s.style.color = "#6c6c78";
      out.append(s);
      continue;
    }
    const s = document.createElement("span");
    s.className = "k" + (ARROW.has(tok) ? " arrow" : "");
    s.textContent = GLYPH[tok] ?? tok;
    out.append(s);
  }
  return out;
}

let meter = null, meterAt = 0;
function fmt(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0");
}
// One stable colour per name, so the bar and every log line agree.
// Hues are quantised to twelve steps and paired with two lightness levels: a
// raw hash gave neighbouring agents hues a few degrees apart, which read as the
// same colour.
function colorOf(name) {
  let h = 2166136261;
  for (const ch of name) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  h = Math.abs(h);
  const hue = (h % 12) * 30 + 8;
  const light = (h >> 4) % 2 ? 72 : 56;
  return `hsl(${hue} 65% ${light}%)`;
}

function setMeter(s) {
  meter = s; meterAt = Date.now();
  document.getElementById("m-acts").textContent = s.actions;
  document.getElementById("m-api").textContent = s.by_api;
  document.getElementById("m-web").textContent = s.by_web;

  const box = document.getElementById("bars");
  const rows = Object.entries(s.agents || {});
  if (!rows.length) { box.textContent = ""; return; }
  const top = Math.max(...rows.map(r => r[1]));
  box.textContent = "";
  for (const [name, n] of rows) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.innerHTML = `<span class="who"></span>` +
                    `<span class="track"><span class="fill"></span></span>` +
                    `<span class="num"></span>`;
    bar.children[0].textContent = name;
    bar.children[0].style.color = colorOf(name);
    bar.children[0].title = name;
    const fill = bar.children[1].firstChild;
    fill.style.width = Math.max(3, (n / top) * 100) + "%";
    fill.style.background = colorOf(name);
    bar.children[2].textContent = n;
    box.appendChild(bar);
  }
}
// tick locally so the clock moves between server messages
setInterval(() => {
  if (!meter) return;
  document.getElementById("m-time").textContent =
    fmt(meter.uptime_s + (Date.now() - meterAt) / 1000);
}, 1000);

function clearLog() {
  rows.textContent = "";
  awaitingHold = [];
  downAt.clear();
  lastId = 0;                 // ids restart after a reset, so the dedupe must too
  logged = 0;
  logcount.textContent = "";
}

function addLog(e) {
  if (e.id <= lastId) return;             // reconnects resend recent backlog
  lastId = e.id;
  empty?.remove();
  const d = new Date(e.at * 1000);
  const ts = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join(":");
  const row = document.createElement("div");
  row.className = "r";
  row.innerHTML =
    `<span class="ts"></span><span class="src"></span>` +
    `<span class="vbwrap"><span class="vb"></span></span><span class="tg"></span>`;
  row.children[0].textContent = ts;
  row.children[1].textContent = e.src;
  row.children[1].style.color = e.src === "web" ? "#7c7c8a" : colorOf(e.src);
  row.children[1].title = e.src;
  const vb = row.children[2].firstChild;
  vb.textContent = e.verb;
  vb.classList.add("v-" + e.verb);
  const tgt = row.children[3];
  if (e.verb === "KEY" || e.verb === "KEYS") {
    tgt.append(keySpans(e.target));
    if (e.detail) {
      const chip = document.createElement("span");
      chip.className = "held";
      chip.textContent = " " + e.detail;
      tgt.appendChild(chip);
    }
    const keys = new Set(e.target.split(" ").filter(t => !/^x\d+$/.test(t)));
    if (keys.size) {
      awaitingHold.push({ el: row, keys, ms: parseFloat(e.detail) * 1000 || 0 });
      if (awaitingHold.length > 12) awaitingHold.shift();
    }
  }
  else if (e.verb === "TEXT") tgt.textContent = JSON.stringify(e.target);
  else tgt.textContent = e.target + (e.detail ? " " + e.detail : "");
  if (!e.ok) row.style.color = "#ff6b6b";
  rows.appendChild(row);
  if (e.thumb) {
    const box = document.createElement("div");
    box.className = "shot";
    const img = new Image();
    img.src = e.thumb;
    img.title = "what the API returned";
    img.onclick = () => window.open(e.thumb, "_blank");
    img.onload = () => { rows.scrollTop = rows.scrollHeight; };
    box.append(img);
    rows.appendChild(box);
  }
  while (rows.children.length > 400) rows.firstChild.remove();
  rows.scrollTop = rows.scrollHeight;
  logcount.textContent = ++logged;
}

const send = o => {
  if (o.t === "key") holdKey(o.k, o.down);
  else if (o.t === "tap") flashKey(o.k);
  return sock?.readyState === 1 && sock.send(JSON.stringify(o));
};

const MAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  Enter: "enter", Escape: "esc", " ": "space", Backspace: "backspace", Tab: "tab",
};
const held = new Set();
addEventListener("keydown", e => {
  const k = MAP[e.key] || (e.key.length === 1 ? e.key.toLowerCase() : null);
  if (!k) return;
  e.preventDefault();
  if (held.has(k)) return;          // ignore auto-repeat, the game does its own
  held.add(k);
  send({ t: "key", k, down: true });
});
addEventListener("keyup", e => {
  const k = MAP[e.key] || (e.key.length === 1 ? e.key.toLowerCase() : null);
  if (!k) return;
  e.preventDefault();
  held.delete(k);
  send({ t: "key", k, down: false });
});

for (const b of document.querySelectorAll("button[data-k]")) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); send({ t: "key", k, down: true }); };
  const up = e => { e.preventDefault(); send({ t: "key", k, down: false }); };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointerleave", up);
  b.addEventListener("pointercancel", up);
}

cv.addEventListener("click", () => cv.focus());

// Generated server-side so the endpoints in it carry this exact host.
const promptEl = document.getElementById("prompt");
let lang = "en";
function loadSkill() {
  fetch("/api/help?lang=" + lang).then(r => r.text()).then(t => promptEl.value = t)
    .catch(() => promptEl.value = "could not load /api/help");
}
for (const b of document.querySelectorAll(".lang button")) {
  b.onclick = () => {
    lang = b.dataset.lang;
    document.querySelectorAll(".lang button").forEach(
      x => x.setAttribute("aria-pressed", String(x === b)));
    loadSkill();
  };
}
loadSkill();
document.getElementById("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(promptEl.value);
  } catch {
    promptEl.select();                    // clipboard API needs https or localhost
    document.execCommand("copy");
  }
  const c = document.getElementById("copied");
  c.classList.add("on");
  setTimeout(() => c.classList.remove("on"), 1400);
};
document.getElementById("open").onclick = () => window.open("/api/help?lang=" + lang, "_blank");

fit();
connect();
</script>

# The documented test matrix (README, "Testing") runs on every push and PR:
# the ubuntu job recreates the venv with the documented uv recipe and runs
# every Python leg (mcp on both majors), the node leg, and the paper's
# numbers pipeline (pure stdlib, no TeX); the paper-pdf job rebuilds main.pdf
# from the committed source in a pinned TeXLive container and fails unless the
# committed PDF is that build, modulo the timestamps hyperref stamps in and
# pdftex's per-build /ID file identifier; the macos
# job runs the one leg that needs Apple frameworks, on pushes to main
# (10x-cost runners; the app rarely changes). Nothing here needs a game, a
# key, or a bucket - the server legs build their own probe core and bridge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain the server legs build against
        run: sudo apt-get update && sudo apt-get install -y zsh ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Recreate the documented venv
        run: |
          uv venv --python 3.14 .venv
          uv pip install -p .venv aiohttp pillow numpy mcp zhconv
      - name: Build the native bridge (recipe line 1; the in-process server tests load it)
        run: sh server/build.sh
      - name: server
        run: .venv/bin/python -m unittest discover -s server -p 'test_*.py'
      - name: mcp-server (current major)
        run: .venv/bin/python -m unittest discover -s mcp-server -p 'test_*.py'
      - name: mcp-server (mcp 1.x)
        run: |
          uv venv --python 3.14 .venv-mcp1
          uv pip install -p .venv-mcp1 'mcp<2'
          .venv-mcp1/bin/python -m unittest discover -s mcp-server -p 'test_*.py'
      - name: bench
        run: .venv/bin/python -m unittest discover -s bench -p 'test_*.py'
      - name: site
        run: .venv/bin/python -m unittest discover -s site -p 'test_*.py'
      - name: agent launcher scripts
        run: .venv/bin/python Scripts/test_agent_launchers.py
      - name: site (the committed pages and briefs must match their generators)
        run: |
          # The leaderboard pages render from site/build.py's template and the
          # agents.md briefs generate from skills/, so the committed output must
          # not drift from either. Deterministic with no bucket: the page stamp
          # is a hash of its own content, not a clock. The venv is never
          # activated (uv -p targets it), so name it as every other step does.
          .venv/bin/python site/build.py
          .venv/bin/python site/agents_build.py
          git diff --exit-code
      - name: paper (the numbers must match the committed snapshot and the committed artifacts)
        run: |
          # Pure stdlib, so no install and no texlive: the benchmark's claims
          # live in the generated .tex the paper \input's, and this checks both
          # that main.tex's claims match the committed catalogue snapshot and
          # that the committed generated files are what the pipeline emits.
          cd paper/src
          python3 check_consistency.py
          python3 figures/emit_numbers.py > figures/numbers.tex
          python3 figures/emit_table.py >/dev/null
          python3 figures/make_metrics.py >/dev/null
          git diff --exit-code figures/numbers.tex tables/aggregate.tex \
            tables/family.tex tables/runs.tex
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node (pi-runner needs npm ci first, as the recipe's own comment says)
        run: |
          npm ci
          npm run test:pi-runner
  swift:
    # The macos runner is 10x-cost; the app only changes on rare pushes, so
    # the compile guard runs on main rather than on every PR.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
  paper-pdf:
    # The numbers leg above checks the paper's claims; this one checks that
    # the committed main.pdf is exactly what a fresh build of the committed
    # source produces (the recipe the paper's README documents; its latexmk
    # alternative flips a coin on a clean tree). TeXLive ships in the job
    # container - scheme-full, the install the PDF was built with. The apt
    # route cannot work: Ubuntu's cjk-latex package carries the CJK package
    # without the C70 font-shape definitions, so the abstract's \\game title
    # dies in an undefined macro two lines after a font-substitution warning.
    # The pinned digest is the build environment: to move it, bump the
    # digest, wait for this job's paper-main artifact, and commit the PDF it
    # builds. Everything must match byte for byte except the two timestamps
    # hyperref stamps in and the per-build /ID file identifier pdftex writes,
    # which are normalised before the comparison.
    runs-on: ubuntu-latest
    container: texlive/texlive@sha256:9d0cc45bb0c1872c5dd6d6e9d3b52cef95c6102f7e29f077c883ac446cdee1bc
    steps:
      - uses: actions/checkout@v4
      - name: python3 for the byte comparison
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Build main.pdf from a fresh clone
        working-directory: paper/src
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Publish the fresh build (recommit it after a source change)
        uses: actions/upload-artifact@v4
        with:
          name: paper-main
          path: paper/src/main.pdf
      - name: The committed PDF is this build, modulo build timestamps
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys

          def normalised(data):
              data = re.sub(rb"/CreationDate \(D:[^)]*\)", b"/CreationDate (D:Z)", data)
              data = re.sub(rb"/ModDate \(D:[^)]*\)", b"/ModDate (D:Z)", data)
              return re.sub(rb"/ID \[<[0-9A-Fa-f]+> <[0-9A-Fa-f]+>\]",
                            b"/ID [<Z> <Z>]", data)

          committed = subprocess.run(
              ["git", "show", "HEAD:paper/src/main.pdf"],
              capture_output=True, check=True).stdout
          fresh = open("paper/src/main.pdf", "rb").read()
          if normalised(fresh) == normalised(committed):
              print("the committed main.pdf is a build of the committed source")
          else:
              print("::error::the committed main.pdf is not a build of the committed source")
              print("commit the paper-main artifact of this run instead")
              sys.exit(1)
          EOF
